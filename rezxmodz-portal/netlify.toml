# netlify.toml - RezX Modz Static & Security Configuration
[build]
  publish = "."

[[redirects]]
  from = "/sub.json"
  to = "/sub.json"
  status = 200
  force = true

[[redirects]]
  from = "/sub.yaml"
  to = "/sub.yaml"
  status = 200
  force = true

[[redirects]]
  from = "/sub"
  to = "/sub.json"
  status = 200
  force = true

[[redirects]]
  from = "/sub.php"
  to = "/sub.json"
  status = 200
  force = true

[[redirects]]
  from = "/sub_rage.php"
  to = "/sub.json"
  status = 200
  force = true

[[redirects]]
  from = "/sub_legit.php"
  to = "/sub.json"
  status = 200
  force = true

[[redirects]]
  from = "/sub_v1.php"
  to = "/sub.json"
  status = 200
  force = true

[[redirects]]
  from = "/sub_v2.php"
  to = "/sub.json"
  status = 200
  force = true

[[redirects]]
  from = "/sub_v3.php"
  to = "/sub.json"
  status = 200
  force = true

[[redirects]]
  from = "/api/config.php"
  to = "/sub.json"
  status = 200
  force = true

[[redirects]]
  from = "/api/config"
  to = "/sub.json"
  status = 200
  force = true

[[redirects]]
  from = "/download/RezX_Auto_Headshot_Aimbot.json"
  to = "/sub.json"
  status = 200
  force = true

[[redirects]]
  from = "/download/RezX_Auto_Headshot_Aimbot.yaml"
  to = "/sub.yaml"
  status = 200
  force = true

[[redirects]]
  from = "/api/features.php"
  to = "/download/features.json"
  status = 200
  force = true

[[redirects]]
  from = "/api/features"
  to = "/download/features.json"
  status = 200
  force = true

[[redirects]]
  from = "/keys.json"
  to = "/keys.json"
  status = 200
  force = true

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200
  force = true

[[redirects]]
  from = "/admin/"
  to = "/admin/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/download/RezX_Modz.apk"
  to = "https://github.com/hiddify/hiddify-app/releases/latest"
  status = 302

[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization, X-Requested-With"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/sub.json"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/sub.yaml"
  [headers.values]
    Content-Type = "text/yaml; charset=utf-8"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/sub.php"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "no-cache, no-store, must-revalidate"
